name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v0.1.0"
      - name: Validate release metadata
        run: |
          test -s CHANGELOG.md
          test -s LICENSE
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake gcc-arm-none-eabi git \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            ninja-build python3
      - name: Check out Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.1 \
            --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
          echo "PICOTOOL_FETCH_FROM_GIT_PATH=$RUNNER_TEMP/picotool" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2
      - name: Build
        run: cmake --build build --parallel
      - name: Package release assets
        run: |
          mkdir -p release
          cp build/pico2_usb_relay.uf2 release/
          cp LICENSE release/
          cp LICENSE-NOTES.md release/
          cp CHANGELOG.md release/
          (cd release && sha256sum pico2_usb_relay.uf2 > SHA256SUMS.txt)
          "$RUNNER_TEMP/picotool/picotool/picotool" info -a release/pico2_usb_relay.uf2
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico2-usbrelay-release
          if-no-files-found: error
          path: release/

  publish:
    name: Publish GitHub release
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: pico2-usbrelay-release
          path: release
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          draft: true
          files: |
            release/pico2_usb_relay.uf2
            release/SHA256SUMS.txt
            release/LICENSE
            release/LICENSE-NOTES.md
            release/CHANGELOG.md
          fail_on_unmatched_files: true
